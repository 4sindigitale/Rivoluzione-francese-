<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rivoluzione! Il quiz</title>
<style>
:root{--bg:#f2f4f8;--tx:#14182b;--cd:#fff;--ac:#1f3a8a;--rd:#c8283a;--bd:#d5dbe8;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1220;--tx:#e8ebf5;--cd:#181c30;--ac:#9db3ff;--rd:#ff7b88;--bd:#2a3050}}
:root[data-theme="dark"]{--bg:#0f1220;--tx:#e8ebf5;--cd:#181c30;--ac:#9db3ff;--rd:#ff7b88;--bd:#2a3050}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.5 Georgia,"Times New Roman",serif}
main{max-width:560px;margin:0 auto;padding:18px 14px 40px}
[hidden]{display:none!important}
.tri{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:6px 0 18px}
.tri b{flex:1;background:#1f3a8a}.tri b+b{background:#f4f4f4}.tri b+b+b{background:#c8283a}
h1{font-size:2rem;line-height:1.15;margin:.2em 0;color:var(--ac)}
h2{font-size:1.25rem;line-height:1.35;margin:.5em 0 .8em}
p{margin:.5em 0}
button{font:inherit;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:12px;padding:12px 16px}
.p{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:700;font-size:1.1rem;width:100%;margin-top:14px;padding:15px}
.hud{display:flex;justify-content:space-between;align-items:center;font-size:1.1rem;font-weight:700}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:10px 0}
#tb{height:100%;width:100%;background:var(--rd);transition:width .1s linear}
.n{margin:0;font-size:.85rem;opacity:.7}
#o button{display:block;width:100%;text-align:left;margin:9px 0;padding:14px;font-size:1rem;background:var(--cd);color:var(--tx);opacity:1}
#o button.ok{background:#1f9d55;color:#fff;border-color:#1f9d55}
#o button.no{background:#c8283a;color:#fff;border-color:#c8283a}
#f{margin-top:8px}
#f:disabled{opacity:.45}
.box{background:var(--cd);border:1px solid var(--bd);border-left:5px solid var(--rd);border-radius:10px;padding:10px 14px;margin:12px 0}
</style>
</head>
<body>
<main>
<div class="tri"><b></b><b></b><b></b></div>

<section id="h">
<h1>Rivoluzione! Il quiz</h1>
<div class="box">
<p>Domande difficili sulle schede: Stati Generali, Bastiglia, Terrore, ghigliottina, Direttorio, Napoleone.</p>
<p>Hai 3 vite ❤️ e 20 secondi per domanda. Ogni risposta esatta di fila fa salire il bonus 🔥. Hai due aiuti 50/50.</p>
</div>
<p id="bs"></p>
<button class="p" id="go">Gioca</button>
</section>

<section id="g" hidden>
<div class="hud"><span id="lv"></span><span id="st"></span><span id="sc"></span></div>
<div class="bar"><div id="tb"></div></div>
<p class="n" id="n"></p>
<h2 id="q"></h2>
<div id="o"></div>
<button id="f">50/50</button>
</section>

<section id="e" hidden>
<h1 id="r"></h1>
<div class="box"><p id="s"></p><p id="b2"></p></div>
<button class="p" id="re">Rigioca</button>
</section>
</main>
<script>
const Q=[
["In quale data si riunirono per la prima volta gli Stati Generali a Versailles?","5 maggio 1789","14 luglio 1789","17 giugno 1789","20 giugno 1789"],
["Quanta parte della popolazione formavano insieme nobiltà e clero?","Meno dell’uno per cento","Circa il dieci per cento","Un quarto","Metà"],
["Perché il terzo stato chiedeva il voto «per testa»?","Perché così avrebbe avuto la maggioranza","Perché voleva escludere il clero","Perché il re lo aveva promesso","Perché era l’uso del Medio Evo"],
["Chi rispose al re: «la nazione riunita non può ricevere ordini»?","Il presidente Bailly","Mirabeau","Lafayette","Saint-Just"],
["A chi il re inviava segretamente richieste di aiuto?","All’imperatore d’Austria e al re di Prussia","Al re di Spagna e allo zar di Russia","All’Inghilterra e all’Olanda","Al papa e al granduca di Toscana"],
["Chi riconobbe Luigi XVI a Varennes durante la fuga?","Un oste","Un soldato della Guardia nazionale","Il sindaco della città","Un contadino"],
["Che cosa fece l’Assemblea dopo la fuga di Varennes?","Finse di credere a un rapimento","Destituì subito il re","Mandò il re in esilio","Dichiarò guerra all’Austria"],
["Perché la Francia mancava di un esercito regolare nel 1792?","I generali erano fuggiti all’estero","Era stato sciolto dal re","Era stato distrutto a Valmy","Mancavano i fondi"],
["Quali battaglie permisero ai francesi di conquistare il Belgio?","Valmy e Jemappes","Dunkerque e Tolone","Austerlitz e Lipsia","Arcole e Marengo"],
["Di quale casa era possesso il Belgio prima della conquista?","Casa d’Austria","Casa di Prussia","Casa di Borbone","Casa d’Inghilterra"],
["Perché i girondini si chiamavano così?","Venivano quasi tutti dalla regione della Gironda","Prendevano il nome da un loro capo","Si riunivano in rue Gironde","Erano nati a Bordeaux"],
["Da che cosa deriva il nome «giacobini»?","Dalla rue Jacob, dove tenevano le prime riunioni","Da Giacomo Renato Hébert","Da un convento di Arras","Dal Giuramento della Pallacorda"],
["Quale regione fu la roccaforte della controrivoluzione?","La Vandea","La Gironda","La Corsica","La Provenza"],
["Quali città ribelli riconquistò il Comitato di salute pubblica?","Marsiglia, Lione e Tolone","Parigi, Lione e Bordeaux","Marsiglia, Nantes e Rouen","Lione, Tolosa e Tolone"],
["Chi era Lazzaro Carnot?","Un ex ufficiale del genio che riorganizzò l’esercito","Un tribuno e agitatore di popolo","Il presidente dell’Assemblea Nazionale","Il medico inventore della ghigliottina"],
["Dove furono sbaragliati gli inglesi sotto la guida di Carnot?","A Dunkerque","A Valmy","A Tolone","A Waterloo"],
["Quale estremista di sinistra Robespierre mandò alla ghigliottina insieme a Danton?","Giacomo Renato Hébert","Giampaolo Marat","Saint-Just","Mirabeau"],
["Chi propose la ghigliottina all’Assemblea Costituente nel 1789?","Il medico J. F. Guillotin","Lo stesso Luigi XVI","Robespierre","Il tribuno Danton"],
["Contro chi fu usata per la prima volta la ghigliottina nel 1792?","Contro un funzionario disonesto","Contro un nobile emigrato","Contro Luigi XVI","Contro un girondino"],
["Dove e quando fu impiegata la più antica macchina simile alla ghigliottina di cui si abbia notizia?","A Genova nel 1507","A Parigi nel 1789","A Tolone nel 1793","A Lione nel 1492"],
["Di quale strumento medievale la ghigliottina era un perfezionamento?","La mannaia","La forca","La spada","La ruota"],
["Com’era costituita la ghigliottina?","Due alte travi scanalate unite in cima da una trave trasversale","Tre travi verticali e una lama rotonda","Una sola trave con un cappio","Due travi inclinate con una lama a martello"],
["Di quale cittadina era avvocato Robespierre?","Arras","Aiaccio","Varennes","Versailles"],
["Di quale filosofo era seguace convinto Robespierre?","Rousseau","Montesquieu","Voltaire","Saint-Just"],
["Perché Robespierre mandò a morte Danton?","Era implicato in uno scandalo sull’amministrazione delle colonie","Aveva tentato di salvare il re","Aveva tradito a Valmy","Si era alleato con la Vandea"],
["Chi fu Luigi Antonio Leone Saint-Just?","Il filosofo e ispiratore che stabilì i princìpi della rivoluzione","Il generale vincitore di Valmy","Un girondino ucciso nel bagno","Il medico della regina"],
["Fino a quando fu consigliere del re il visconte di Mirabeau?","Fino al 1791, quando morì","Fino al 14 luglio 1789","Fino alla fuga a Varennes","Fino al 1793"],
["Dove e da chi fu ucciso Marat?","Nel bagno, da Carlotta Corday","A Varennes, da un oste","Sulla ghigliottina, per ordine di Robespierre","In Vandea, da un soldato"],
["Di quanti membri era composto il Direttorio?","Cinque","Tre","Sette","Dodici"],
["Quale parte della società trionfò con il Direttorio?","La borghesia","La nobiltà","Il clero","I giacobini"],
["Con chi fu fatta la pace il 5 febbraio 1795?","Con il granduca di Toscana","Con la Prussia","Con la Spagna","Con l’Austria"],
["Che cosa ottenne la Francia dalla pace con la Prussia?","L’occupazione della riva sinistra del Reno","La parte spagnola di Santo Domingo","Il Belgio","Alcune città olandesi"],
["Che cosa ottenne la Francia dalla pace con la Spagna?","La parte spagnola di Santo Domingo","L’Illiria","La riva sinistra del Reno","Il Belgio"],
["Quali Stati restavano in guerra con la Francia dopo i trattati del Direttorio?","Inghilterra, Austria e Russia","Prussia, Spagna e Toscana","Olanda, Austria e Spagna","Inghilterra e Prussia"],
["Dove si svolse il Giuramento della Pallacorda?","In una palestra dove si praticava quel gioco","Nella reggia di Versailles","Nella sala del Comitato di salute pubblica","Nella piazza della Bastiglia"],
["Chi istituì la Guardia nazionale?","Lafayette","Bailly","Danton","Carnot"],
["Che cosa avvenne il 10 agosto 1792?","L’Assemblea proclamò la fine della monarchia","Fu giustiziato Luigi XVI","Fu presa la Bastiglia","Fu dichiarata guerra all’Austria"],
["Quale assemblea sostituì la Legislativa tra l’agosto e il settembre 1792?","La Convenzione","Il Direttorio","Il Consolato","Gli Stati Generali"],
["A quale giorno del calendario rivoluzionario corrisponde il 27 luglio 1794?","10 termidoro","18 brumaio","10 brumaio","27 termidoro"],
["Quanti torrioni rinforzavano i muri della Bastiglia?","Otto","Quattro","Sei","Dodici"],
["Quanto era profondo il fossato che circondava la Bastiglia?","Sette metri","Undici metri","Trentasei metri","Quattro metri"],
["Sotto quale re fu portata a termine la costruzione della Bastiglia?","Carlo VI","Carlo V","Luigi XVI","Carlo VIII"],
["A che età Luigi XVI salì al trono nel 1774?","Appena ventenne","A quindici anni","A trent’anni","A diciotto anni"],
["Perché Luigi XVI aveva appoggiato la ribellione delle colonie americane?","Per indebolire la potenza coloniale inglese","Per ottenere nuove terre","Per sostenere Lafayette","Per pagare i debiti dello stato"],
["Dove e in che anno nacque Napoleone Bonaparte?","Ad Aiaccio, nel 1769","A Tolone, nel 1769","A Parigi, nel 1771","A Firenze, nel 1768"],
["Dove Napoleone diede prova di coraggio e intuito strategico nel 1793?","All’assedio di Tolone","A Valmy","A Dunkerque","A Jemappes"],
["Con quale scopo fu compiuta la spedizione d’Egitto (1798)?","Indebolire l’Inghilterra minacciando il commercio con l’India","Conquistare la Russia","Liberare il Belgio","Fondare la Repubblica Batava"],
["A quale data corrisponde il colpo di stato del 18 brumaio?","9 novembre 1799","27 luglio 1794","18 giugno 1815","2 dicembre 1805"],
["In quale battaglia Napoleone sconfisse Prussia, Austria e Russia nel 1805?","Austerlitz","Waterloo","Lipsia","Arcole"],
["Dove fu sconfitto da una nuova coalizione prima dell’esilio all’Elba?","A Lipsia","A Waterloo","A Mosca","A Tolone"],
["Quando fu sconfitto a Waterloo?","18 giugno 1815","5 maggio 1821","2 dicembre 1805","9 novembre 1799"],
["Quando morì Napoleone a Sant’Elena?","5 maggio 1821","18 giugno 1815","9 novembre 1799","2 dicembre 1805"]
];
const $=s=>document.querySelector(s);
const sh=a=>{for(let k=a.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[a[k],a[j]]=[a[j],a[k]]}return a};
const show=id=>["h","g","e"].forEach(x=>$("#"+x).hidden=x!=id);
let qs,i,sc,lv,st,ok,hl,t,tm,lk,bs=0;
try{bs=+localStorage.getItem("rvq")||0}catch(e){}
$("#bs").textContent=bs?"Record: "+bs+" punti":"";
function start(){qs=sh(Q.slice());i=0;sc=0;lv=3;st=0;ok=0;hl=2;lk=0;show("g");nx()}
function hud(){$("#lv").textContent="❤️".repeat(lv)+"🖤".repeat(3-lv);$("#sc").textContent=sc+" pt";$("#st").textContent=st>1?"🔥 x"+st:"";$("#f").textContent="✂️ 50/50 ("+hl+")";$("#f").disabled=!hl||!!lk}
function nx(){
if(i>=qs.length||lv<1)return end();
lk=0;const q=qs[i];
$("#n").textContent="Domanda "+(i+1)+" di "+qs.length;
$("#q").textContent=q[0];
const b=$("#o");b.innerHTML="";
sh(q.slice(1).map((x,k)=>[x,!k])).forEach(([x,c])=>{const e=document.createElement("button");e.textContent=x;e.dataset.c=c?1:0;e.onclick=()=>ans(e);b.appendChild(e)});
t=20;clearInterval(tm);$("#tb").style.width="100%";
tm=setInterval(()=>{t-=.1;$("#tb").style.width=Math.max(t,0)*5+"%";if(t<=0)ans(null)},100);
hud()}
function ans(e){
if(lk)return;lk=1;clearInterval(tm);
const c=!!e&&e.dataset.c=="1";
document.querySelectorAll("#o button").forEach(x=>{x.disabled=true;if(x.dataset.c=="1")x.classList.add("ok")});
if(c){st++;ok++;sc+=100+Math.ceil(t)*5+(st-1)*25}else{lv--;st=0;if(e)e.classList.add("no")}
hud();i++;setTimeout(nx,1500)}
function fifty(){
if(!hl||lk)return;hl--;
const w=[...document.querySelectorAll("#o button")].filter(x=>x.dataset.c=="0"&&!x.disabled);
sh(w).slice(0,2).forEach(x=>{x.disabled=true;x.style.opacity=.25});hud()}
function end(){
clearInterval(tm);show("e");
const r=ok>=42?"👑 Napoleone Bonaparte":ok>=32?"🗡️ Robespierre":ok>=22?"🎙️ Danton":ok>=12?"⚓ Girondino":"🪵 Suddito del terzo stato";
$("#r").textContent=lv<1?"💀 Ghigliottinato!":"🏆 Rivoluzione completata!";
$("#s").textContent="Risposte esatte: "+ok+" su "+qs.length+". Grado: "+r;
let nr="";
if(sc>bs){bs=sc;nr=" Nuovo record!";try{localStorage.setItem("rvq",bs)}catch(e){}}
$("#b2").textContent="Punti: "+sc+" (record "+bs+")."+nr}
$("#go").onclick=start;$("#re").onclick=start;$("#f").onclick=fifty;
</script>
</body>
</html>
